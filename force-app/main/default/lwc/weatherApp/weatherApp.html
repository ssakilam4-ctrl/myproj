<template>

    <lightning-card title="Weather Application">

        <div class="slds-m-around_medium">

            <lightning-input
                type="text"
                label="Enter City Name"
                value={cityName}
                onchange={handleInputChange}>
            </lightning-input>

            <lightning-button
                label="Get Weather"
                onclick={handleWeatherSearch}
                class="slds-m-top_small">
            </lightning-button>

        </div>

    </lightning-card>

</template>
